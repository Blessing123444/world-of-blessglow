<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>A Love Written in Silence | World of BlessGlow</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .reading-room {
      max-width: 850px;
      margin: 40px auto;
      padding: 25px;
    }

    .book-intro {
      text-align: center;
      margin-bottom: 35px;
    }

    .book-intro h1 {
      color: #d4af37;
    }

    .free-badge {
      display: inline-block;
      padding: 8px 15px;
      border: 1px solid #d4af37;
      color: #d4af37;
      border-radius: 20px;
      margin: 10px 0;
    }

    .chapter-panel {
      background: #1b1b1b;
      border: 1px solid #3a3324;
      border-radius: 12px;
      padding: 25px;
      line-height: 1.9;
    }

    .chapter-panel h2 {
      color: #d4af37;
      text-align: center;
    }

    .chapter-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      min-height: 180px;
    }

    .reader-controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 25px;
    }

    .reader-controls button,
    .reader-controls a {
      background: #d4af37;
      color: #111;
      border: none;
      border-radius: 6px;
      padding: 12px 16px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .reader-controls button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .chapter-select {
      display: block;
      width: 100%;
      margin: 20px 0;
      padding: 12px;
      background: #111;
      color: #fff;
      border: 1px solid #d4af37;
      border-radius: 6px;
    }

    .reader-note {
      color: #bbb;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .reading-room {
        padding: 15px;
      }

      .chapter-panel {
        padding: 18px;
      }

      .reader-controls button,
      .reader-controls a {
        padding: 10px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <main class="reading-room">

    <div class="book-intro">
      <p>WORLD OF BLESSGLOW</p>

      <h1>A Love Written in Silence</h1>

      <p>
        Some feelings are never spoken.
        Some love stories are never forgotten.
      </p>

      <p>By Blessing Effiong</p>

      <span class="free-badge">FREE DURING LAUNCH</span>

      <p>
        <a href="books.html">← Back to Books</a>
      </p>
    </div>

    <section class="chapter-panel">

      <label for="chapterSelect">
        Choose a section or chapter
      </label>

      <select id="chapterSelect" class="chapter-select">
        <option value="">Loading manuscript...</option>
      </select>

      <h2 id="chapterTitle">Loading your book...</h2>

      <div id="chapterText" class="chapter-text">Please wait while your manuscript loads.</div>

      <div class="reader-controls">
        <button id="previousButton" disabled>
          ← Previous
        </button>

        <button id="nextButton" disabled>
          Next →
        </button>
      </div>

      <p class="reader-note" id="readingProgress">
        Preparing your reading experience...
      </p>

    </section>

  </main>

  <!-- Load the actual manuscript before initializing the reader. -->
  <script src="love-chapters.js"></script>

  <script>
  (function () {
    "use strict";

    const chapterTitle =
      document.getElementById("chapterTitle");

    const chapterText =
      document.getElementById("chapterText");

    const chapterSelect =
      document.getElementById("chapterSelect");

    const prevButton =
      document.getElementById("previousButton");

    const nextButton =
      document.getElementById("nextButton");

    const progressElement =
      document.getElementById("readingProgress");

    const STORAGE_KEY =
      "blessglow-love-reader-section-progress-v2";

    const book = window.LOVE_BOOK;

    function showError(message) {
      chapterTitle.textContent = "Manuscript unavailable";
      chapterText.textContent = message;
      chapterSelect.innerHTML =
        '<option value="">Unable to load manuscript</option>';

      prevButton.disabled = true;
      nextButton.disabled = true;

      progressElement.textContent =
        "Please check the manuscript connection.";
    }

    if (!book || !Array.isArray(book.chapters)) {
      showError(
        "The manuscript file loaded incorrectly or the expected book data was not found. Please check love-chapters.js."
      );
      return;
    }

    const sections = [];

    function addSection(type, title, content, number) {
      if (
        typeof content !== "string" ||
        !content.trim()
      ) {
        return;
      }

      sections.push({
        type: type,
        title: title,
        content: content.trim(),
        number: number || null
      });
    }

    // -----------------------------------------
    // OPENING PAGES
    // -----------------------------------------

    function buildFrontMatter() {
      const frontMatter =
        String(book.frontMatter || "")
          .replace(/\r\n/g, "\n")
          .trim();

      if (!frontMatter) {
        return;
      }

      const parts = frontMatter.split(
        /\f(?=(?:Copyright\b|Dedication\b|Introduction\b|🎵\s*A Reading Playlist|📖\s*Table of Contents))/i
      );

      parts.forEach(function (part) {
        const content =
          part.replace(/\f/g, "\n").trim();

        if (!content) {
          return;
        }

        if (/^Copyright\b/i.test(content)) {
          addSection(
            "front",
            "Copyright & Disclaimer",
            content
          );
          return;
        }

        if (/^Dedication\b/i.test(content)) {
          addSection(
            "front",
            "Dedication",
            content
          );
          return;
        }

        if (/^Introduction\b/i.test(content)) {
          addSection(
            "front",
            "Introduction",
            content
          );
          return;
        }

        if (/^🎵\s*A Reading Playlist/i.test(content)) {
          const tipMatch =
            /\n\s*Reading Tip\s*\n/i.exec(content);

          if (tipMatch) {
            addSection(
              "front",
              "Reading Playlist",
              content.slice(0, tipMatch.index)
            );

            addSection(
              "front",
              "Reading Tip",
              content.slice(tipMatch.index)
            );
          } else {
            addSection(
              "front",
              "Reading Playlist",
              content
            );
          }

          return;
        }

        if (/^📖\s*Table of Contents/i.test(content)) {
          addSection(
            "front",
            "Table of Contents",
            content
          );
          return;
        }

        addSection(
          "front",
          "Title Page",
          content
        );
      });
    }

    // -----------------------------------------
    // STORY CHAPTERS
    // -----------------------------------------

    function buildChapters() {
      book.chapters.forEach(function (chapter, index) {
        const number = chapter.number || index + 1;

        const content =
          String(chapter.content || "").trim();

        if (!content) {
          return;
        }

        const lines = content
          .split(/\r?\n/)
          .map(function (line) {
            return line.trim();
          })
          .filter(Boolean);

        let storyTitle = "";

        if (lines.length > 1) {
          storyTitle = lines[1];
        }

        if (
          storyTitle &&
          /^chapter\s+\d+/i.test(storyTitle)
        ) {
          storyTitle = "";
        }

        const label = storyTitle
          ? "Chapter " + number + " — " + storyTitle
          : "Chapter " + number;

        sections.push({
          type: "chapter",
          title: label,
          heading: "Chapter " + number,
          content: content,
          number: number
        });
      });
    }

    // -----------------------------------------
    // CLOSING PAGES
    // -----------------------------------------

    function buildBackMatter() {
      const backMatter =
        String(book.backMatter || "")
          .replace(/\r\n/g, "\n")
          .replace(/\f/g, "\n")
          .trim();

      if (!backMatter) {
        return;
      }

      const lines = backMatter.split("\n");

      const headingPattern =
        /^(Acknowledgements|Acknowledgments|About the Author|Thank You for Reading)$/i;

      let currentTitle = "";
      let currentLines = [];
      let otherLines = [];

      function saveCurrentSection() {
        if (
          currentTitle &&
          currentLines.length
        ) {
          addSection(
            "back",
            currentTitle,
            currentLines.join("\n")
          );
        }

        currentTitle = "";
        currentLines = [];
      }

      function saveOtherMaterial() {
        const content =
          otherLines.join("\n").trim();

        if (content) {
          addSection(
            "back",
            "Closing Material",
            content
          );
        }

        otherLines = [];
      }

      lines.forEach(function (line) {
        const trimmed = line.trim();

        if (headingPattern.test(trimmed)) {
          saveOtherMaterial();
          saveCurrentSection();

          currentTitle = trimmed;
          currentLines = [line];
        } else if (currentTitle) {
          currentLines.push(line);
        } else {
          otherLines.push(line);
        }
      });

      saveOtherMaterial();
      saveCurrentSection();
    }

    // Build sections in book order.
    buildFrontMatter();
    buildChapters();
    buildBackMatter();

    if (!sections.length) {
      showError(
        "No manuscript sections were found. Please check the data in love-chapters.js."
      );
      return;
    }

    // -----------------------------------------
    // DROPDOWN
    // -----------------------------------------

    chapterSelect.innerHTML = "";

    sections.forEach(function (section, index) {
      const option =
        document.createElement("option");

      option.value = String(index);

      if (section.type === "chapter") {
        option.textContent = section.title;
      } else if (section.type === "front") {
        option.textContent =
          "📖 " + section.title;
      } else {
        option.textContent =
          "✨ " + section.title;
      }

      chapterSelect.appendChild(option);
    });

    // -----------------------------------------
    // SAVED POSITION
    // -----------------------------------------

    let currentIndex = 0;

    try {
      const savedIndex = Number(
        localStorage.getItem(STORAGE_KEY)
      );

      if (
        Number.isInteger(savedIndex) &&
        savedIndex >= 0 &&
        savedIndex < sections.length
      ) {
        currentIndex = savedIndex;
      }
    } catch (error) {
      currentIndex = 0;
    }

    // -----------------------------------------
    // DISPLAY SELECTED SECTION
    // -----------------------------------------

    function showSection() {
      const section = sections[currentIndex];

      if (!section) {
        return;
      }

      chapterSelect.value =
        String(currentIndex);

      chapterTitle.textContent =
        section.heading || section.title;

      chapterText.textContent =
        section.content;

      prevButton.disabled =
        currentIndex === 0;

      nextButton.disabled =
        currentIndex === sections.length - 1;

      progressElement.textContent =
        "Section " +
        (currentIndex + 1) +
        " of " +
        sections.length +
        " · Your progress is saved on this device.";

      try {
        localStorage.setItem(
          STORAGE_KEY,
          String(currentIndex)
        );
      } catch (error) {
        // The reader can still work without saved progress.
      }
    }

    // -----------------------------------------
    // NAVIGATION
    // -----------------------------------------

    prevButton.addEventListener(
      "click",
      function () {
        if (currentIndex > 0) {
          currentIndex--;
          showSection();
        }
      }
    );

    nextButton.addEventListener(
      "click",
      function () {
        if (currentIndex < sections.length - 1) {
          currentIndex++;
          showSection();
        }
      }
    );

    chapterSelect.addEventListener(
      "change",
      function () {
        const selectedIndex =
          Number(chapterSelect.value);

        if (
          Number.isInteger(selectedIndex) &&
          selectedIndex >= 0 &&
          selectedIndex < sections.length
        ) {
          currentIndex = selectedIndex;
          showSection();
        }
      }
    );

    // Show the opening section when the page loads.
    showSection();

  })();
  </script>

</body>
</html>
