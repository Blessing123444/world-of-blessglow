<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#211914">

<title>Behind Her Smile — World of BlessGlow</title>

<style>
:root {
  --bg: #f7f1e8;
  --paper: #fffdf8;
  --ink: #2c2521;
  --muted: #766b62;
  --gold: #b58b46;
  --dark: #211914;
  --line: #e7dbca;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  line-height: 1.8;
}

.top {
  background: var(--dark);
  color: #fff7e9;
  padding: 26px 16px;
  text-align: center;
}

.brand {
  font: 600 12px/1.5 Arial, sans-serif;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #e4c58a;
}

.top h1 {
  font-size: clamp(28px, 6vw, 42px);
  line-height: 1.2;
  margin: 14px auto 8px;
  max-width: 760px;
}

.subtitle {
  font: 14px/1.7 Arial, sans-serif;
  color: #e8ded0;
}

.author {
  margin-top: 8px;
  font: italic 13px/1.6 Georgia, serif;
  color: #e4c58a;
}

.wrap {
  width: 100%;
  max-width: 850px;
  margin: 22px auto;
  padding: 0 14px 40px;
}

.controls,
.reader {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 5px 20px #3b28100b;
}

.controls {
  padding: 16px;
  margin-bottom: 16px;
}

/* Keep both dropdowns side by side */
.control-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
  gap: 10px;
  align-items: start;
}

.control-item {
  min-width: 0;
}

.control-item label {
  display: block;
  font: 600 12px/1.5 Arial, sans-serif;
  color: var(--muted);
  margin-bottom: 7px;
}

select {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 11px 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  font: 13px Arial, sans-serif;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

.buttons button {
  flex: 1;
  min-width: 0;
  border: 0;
  border-radius: 8px;
  padding: 12px 8px;
  background: var(--dark);
  color: white;
  font-size: 13px;
  cursor: pointer;
}

.buttons button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.progress-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 16px;
  font: 12px Arial, sans-serif;
  color: var(--muted);
}

.bar {
  height: 5px;
  margin-top: 8px;
  background: #eee5d8;
  border-radius: 9px;
  overflow: hidden;
}

.bar span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--gold);
  transition: width 0.2s;
}

.reader {
  padding: clamp(20px, 5vw, 44px);
  min-height: 300px;
}

.section-label {
  font: 600 11px Arial, sans-serif;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold);
}

.reader h2 {
  font-size: clamp(25px, 5vw, 34px);
  line-height: 1.3;
  margin: 8px 0 24px;
}

.story {
  font-size: 18px;
  line-height: 1.9;
  overflow-wrap: anywhere;
  transition: font-size 0.15s;
}

.story p {
  margin: 0 0 1.2em;
  white-space: pre-wrap;
}

.story .quote {
  font-style: italic;
  color: #79623f;
  text-align: center;
  margin: 28px 0;
}

.footer {
  text-align: center;
  color: var(--muted);
  font: 12px/1.8 Arial, sans-serif;
  padding: 22px 12px;
}

.footer a {
  color: inherit;
}

.error {
  color: #8c2c2c;
  font-family: Arial, sans-serif;
  overflow-wrap: anywhere;
}

.hidden {
  display: none !important;
}

@media (max-width: 360px) {
  .controls {
    padding: 11px;
  }

  .control-grid {
    gap: 7px;
  }

  .control-item label {
    font-size: 11px;
  }

  select {
    padding: 10px 5px;
    font-size: 12px;
  }

  .buttons button {
    font-size: 12px;
  }

  .reader {
    padding: 17px;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="brand">World of BlessGlow</div>

  <h1>Behind Her Smile</h1>

  <div class="subtitle">The Girl They Framed</div>

  <div class="author">A novel by Blessing Effiong</div>
</header>

<main class="wrap">

  <section class="controls" aria-label="Reader controls">

    <div class="control-grid">

      <div class="control-item">
        <label for="chapterSelect">Choose a Section</label>
        <select id="chapterSelect">
          <option>Loading book...</option>
        </select>
      </div>

      <div class="control-item">
        <label for="fontSizeSelect">Reading Text Size</label>
        <select id="fontSizeSelect">
          <option value="16px">Small</option>
          <option value="18px" selected>Medium</option>
          <option value="20px">Large</option>
          <option value="23px">Very Large</option>
        </select>
      </div>

    </div>

    <div class="buttons">
      <button id="prevBtn" type="button">← Previous</button>
      <button id="nextBtn" type="button">Next →</button>
    </div>

    <div class="progress-row">
      <span id="progressText">Loading progress...</span>
      <span id="positionText"></span>
    </div>

    <div class="bar">
      <span id="progressBar"></span>
    </div>

  </section>

  <article class="reader">

    <div class="section-label" id="sectionLabel">Reading</div>

    <h2 id="sectionTitle">Loading your book...</h2>

    <div class="story" id="storyContent" aria-live="polite"></div>

    <p id="errorMessage" class="error hidden"></p>

  </article>

  <div class="footer">
    © <span id="year"></span> Blessing Effiong · World of BlessGlow
    <br>
    <a href="books.html">← Back to Books</a>
  </div>

</main>

<!-- Keep this filename exactly as it is -->
<script src="smile-chapters.js"></script>

<script>
(function () {
  const book = window.SMILE_BOOK;

  const select = document.getElementById("chapterSelect");
  const fontSelect = document.getElementById("fontSizeSelect");
  const titleEl = document.getElementById("sectionTitle");
  const labelEl = document.getElementById("sectionLabel");
  const contentEl = document.getElementById("storyContent");
  const errorEl = document.getElementById("errorMessage");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const progressText = document.getElementById("progressText");
  const positionText = document.getElementById("positionText");
  const progressBar = document.getElementById("progressBar");

  document.getElementById("year").textContent =
    new Date().getFullYear();

  const sectionStorageKey = "blessglow-read-smile-section";
  const fontStorageKey = "blessglow-read-smile-font";

  function showError(message) {
    select.innerHTML = '<option value="">Book unavailable</option>';
    titleEl.textContent = "The book could not be loaded";
    errorEl.classList.remove("hidden");
    errorEl.textContent = message;
    contentEl.textContent = "";
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    progressText.textContent = "";
    positionText.textContent = "";
    progressBar.style.width = "0%";
  }

  if (!book || !Array.isArray(book.chapters)) {
    showError(
      "Please check that smile-chapters.js is in the same folder " +
      "as read-smile.html and contains window.SMILE_BOOK with a chapters array."
    );
    return;
  }

  const sections = [];

  function addSection(key, label, title, content, type) {
    if (
      content !== undefined &&
      content !== null &&
      String(content).trim() !== ""
    ) {
      sections.push({
        key: key,
        label: label,
        title: title,
        content: String(content),
        type: type
      });
    }
  }

  /*
   * Opening pages.
   * If the data file contains separate front-matter fields,
   * show them individually. Otherwise, show frontMatter as one section.
   */
  const separateOpeningFields = [
    ["copyright", "Copyright"],
    ["disclaimer", "Disclaimer"],
    ["dedication", "Dedication"],
    ["tableOfContents", "Table of Contents"]
  ];

  let hasSeparateOpening = false;

  separateOpeningFields.forEach(function (item) {
    const key = item[0];
    const label = item[1];

    if (book[key]) {
      addSection(
        "opening-" + key,
        label,
        label,
        book[key],
        "Opening Pages"
      );

      hasSeparateOpening = true;
    }
  });

  if (book.frontMatter) {
    addSection(
      "front",
      "Opening Pages",
      "Opening Pages",
      book.frontMatter,
      "Opening Pages"
    );
  }

  if (book.openingQuote) {
    addSection(
      "opening-quote",
      "Opening Quote",
      "Opening Quote",
      book.openingQuote,
      "Opening Quote"
    );
  }

  addSection(
    "prologue",
    "Prologue",
    "Prologue",
    book.prologue,
    "Prologue"
  );

  book.chapters.forEach(function (chapter, index) {
    const number =
      chapter.number !== undefined ? chapter.number : index + 1;

    const chapterTitle = chapter.title
      ? "Chapter " + number + " — " + chapter.title
      : "Chapter " + number;

    addSection(
      "chapter-" + index,
      chapterTitle,
      chapterTitle,
      chapter.content || chapter.text || "",
      "Chapter " + number
    );
  });

  addSection(
    "epilogue",
    "Epilogue",
    "Epilogue",
    book.epilogue,
    "Epilogue"
  );

  addSection(
    "final-quote",
    "Final Quote",
    "Final Quote",
    book.finalQuote,
    "Final Quote"
  );

  /*
   * Closing pages are separate whenever the data file
   * provides them as separate fields.
   */
  const closingFields = [
    ["acknowledgments", "✨ Acknowledgments"],
    ["acknowledgements", "✨ Acknowledgements"],
    ["aboutAuthor", "👩🏽‍💻 About the Author"],
    ["thankYou", "💙 Thank You"],
    ["copyrightNotice", "Copyright"],
    ["closingDisclaimer", "Disclaimer"]
  ];

  const addedClosingKeys = new Set();

  closingFields.forEach(function (item) {
    const key = item[0];
    const label = item[1];

    if (book[key] && !addedClosingKeys.has(key)) {
      addSection(
        "closing-" + key,
        label,
        label,
        book[key],
        "Closing Pages"
      );

      addedClosingKeys.add(key);
    }
  });

  /*
   * If the data file contains only a combined backMatter field,
   * display it rather than losing the content.
   */
  if (
    book.backMatter &&
    !book.acknowledgments &&
    !book.acknowledgements &&
    !book.aboutAuthor &&
    !book.thankYou
  ) {
    addSection(
      "back",
      "Closing Pages",
      "Closing Pages",
      book.backMatter,
      "Closing Pages"
    );
  }

  if (sections.length === 0) {
    showError("No readable sections were found in the book data.");
    return;
  }

  select.innerHTML = "";

  sections.forEach(function (section, index) {
    const option = document.createElement("option");
    option.value = String(index);
    option.textContent = section.label;
    select.appendChild(option);
  });

  let current = 0;

  try {
    const saved = Number(localStorage.getItem(sectionStorageKey));

    if (
      Number.isInteger(saved) &&
      saved >= 0 &&
      saved < sections.length
    ) {
      current = saved;
    }
  } catch (error) {
    // Reading still works if browser storage is unavailable.
  }

  try {
    const savedFont = localStorage.getItem(fontStorageKey);
    const validSizes = ["16px", "18px", "20px", "23px"];

    if (validSizes.includes(savedFont)) {
      fontSelect.value = savedFont;
    }
  } catch (error) {
    // Use the default font size.
  }

  contentEl.style.fontSize = fontSelect.value;

  function renderContent(text) {
    contentEl.innerHTML = "";

    const blocks = String(text)
      .replace(/\r/g, "")
      .split(/\n\s*\n/);

    blocks.forEach(function (block) {
      const paragraphText = block.trim();

      if (!paragraphText) {
        return;
      }

      const paragraph = document.createElement("p");
      paragraph.textContent = paragraphText;

      if (
        /^(📖\s*)?(Opening Quote|Final Quote)$/i.test(paragraphText) ||
        (/^["“].*["”]$/.test(paragraphText) &&
          paragraphText.length < 400)
      ) {
        paragraph.className = "quote";
      }

      contentEl.appendChild(paragraph);
    });

    /*
     * Preserve the content even when the section contains
     * text without blank lines.
     */
    if (!contentEl.children.length && String(text).trim()) {
      const paragraph = document.createElement("p");
      paragraph.textContent = String(text).trim();
      contentEl.appendChild(paragraph);
    }
  }

  function render() {
    const section = sections[current];

    if (!section) {
      return;
    }

    select.value = String(current);
    labelEl.textContent = section.type;
    titleEl.textContent = section.title;

    renderContent(section.content);

    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === sections.length - 1;

    progressText.textContent =
      "Section " + (current + 1) + " of " + sections.length;

    const percentage = Math.round(
      ((current + 1) / sections.length) * 100
    );

    positionText.textContent = percentage + "%";
    progressBar.style.width = percentage + "%";

    try {
      localStorage.setItem(sectionStorageKey, String(current));
    } catch (error) {
      // The reader remains usable without saved progress.
    }

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  select.addEventListener("change", function () {
    current = Number(select.value);
    render();
  });

  prevBtn.addEventListener("click", function () {
    if (current > 0) {
      current--;
      render();
    }
  });

  nextBtn.addEventListener("click", function () {
    if (current < sections.length - 1) {
      current++;
      render();
    }
  });

  fontSelect.addEventListener("change", function () {
    contentEl.style.fontSize = fontSelect.value;

    try {
      localStorage.setItem(fontStorageKey, fontSelect.value);
    } catch (error) {
      // Font size still changes for the current visit.
    }
  });

  render();
})();
</script>

</body>
</html>
