<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17120f">
<title>Behind Her Smile — World of BlessGlow</title>

<style>
:root{
  --bg:#f7f1e8;
  --paper:#fffdf8;
  --ink:#2c2521;
  --muted:#766b62;
  --gold:#b58b46;
  --dark:#211914;
  --line:#e7dbca;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Georgia,'Times New Roman',serif;
  line-height:1.8;
}
.top{
  background:var(--dark);
  color:#fff7e9;
  padding:22px 16px;
  text-align:center;
}
.brand{
  font:600 12px/1.5 Arial,sans-serif;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#e4c58a;
}
.top h1{
  font-size:clamp(25px,5vw,38px);
  line-height:1.2;
  margin:12px auto 8px;
  max-width:760px;
}
.subtitle{
  font:14px Arial,sans-serif;
  color:#e8ded0;
}
.wrap{
  max-width:850px;
  margin:22px auto;
  padding:0 14px 40px;
}
.controls,.reader{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 5px 20px #3b28100b;
}
.controls{
  padding:16px;
  display:grid;
  gap:12px;
}
.controls label{
  font:600 13px Arial,sans-serif;
  color:var(--muted);
}
select{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:8px;
  background:white;
  color:var(--ink);
  font-size:15px;
}
.buttons{
  display:flex;
  gap:10px;
}
.buttons button{
  flex:1;
  border:0;
  border-radius:8px;
  padding:12px 10px;
  background:var(--dark);
  color:white;
  font-size:14px;
  cursor:pointer;
}
.buttons button:disabled{
  opacity:.35;
  cursor:not-allowed;
}
.progress-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font:12px Arial,sans-serif;
  color:var(--muted);
}
.bar{
  height:5px;
  background:#eee5d8;
  border-radius:9px;
  overflow:hidden;
}
.bar span{
  display:block;
  height:100%;
  width:0;
  background:var(--gold);
  transition:width .2s;
}
.reader{
  margin-top:16px;
  padding:clamp(20px,5vw,44px);
  min-height:300px;
}
.section-label{
  font:600 11px Arial,sans-serif;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--gold);
}
.reader h2{
  font-size:clamp(25px,5vw,34px);
  line-height:1.25;
  margin:8px 0 22px;
}
.story{
  font-size:18px;
  overflow-wrap:anywhere;
}
.story p{
  margin:0 0 1.1em;
  white-space:pre-wrap;
}
.story .quote{
  font-style:italic;
  color:#79623f;
  text-align:center;
}
.footer{
  text-align:center;
  color:var(--muted);
  font:12px/1.6 Arial,sans-serif;
  padding:22px 12px;
}
.footer a{color:inherit}
.error{
  color:#8c2c2c;
  font-family:Arial,sans-serif;
}
.hidden{display:none!important}

@media(max-width:480px){
  .story{font-size:17px}
  .buttons button{font-size:13px}
}
</style>

<link rel="stylesheet" href="reviews.css">
</head>

<body>

<header class="top">
  <div class="brand">World of BlessGlow</div>
  <h1>Behind Her Smile</h1>
  <div class="subtitle">
    The Girl They Framed · A novel by Blessing Effiong
  </div>
</header>

<main class="wrap">

  <section class="controls" aria-label="Reader controls">
    <label for="chapterSelect">Choose a section</label>

    <select id="chapterSelect">
      <option>Loading book…</option>
    </select>

    <div class="buttons">
      <button id="prevBtn" type="button">← Previous</button>
      <button id="nextBtn" type="button">Next →</button>
    </div>

    <div class="progress-row">
      <span id="progressText">Loading progress…</span>
      <span id="positionText"></span>
    </div>

    <div class="bar">
      <span id="progressBar"></span>
    </div>
  </section>

  <article class="reader">
    <div class="section-label" id="sectionLabel">Reading</div>
    <h2 id="sectionTitle">Loading your book…</h2>
    <div class="story" id="storyContent" aria-live="polite"></div>
    <p id="errorMessage" class="error hidden"></p>
  </article>

</main>

<!-- Reader reviews: the review form unlocks at the final section. -->
<section
  id="book-reviews"
  data-book="behind-her-smile"
  aria-label="Reviews for Behind Her Smile">
</section>

<div class="footer">
  © <span id="year"></span> Blessing Effiong · World of BlessGlow
  <br>
  <a href="books.html">Back to Books</a>
</div>

<script src="smile-chapters.js"></script>

<script>
(function(){
  const book = window.SMILE_BOOK;

  const select = document.getElementById('chapterSelect');
  const titleEl = document.getElementById('sectionTitle');
  const labelEl = document.getElementById('sectionLabel');
  const contentEl = document.getElementById('storyContent');
  const errorEl = document.getElementById('errorMessage');
  const prev = document.getElementById('prevBtn');
  const next = document.getElementById('nextBtn');

  document.getElementById('year').textContent =
    new Date().getFullYear();

  if(!book || !Array.isArray(book.chapters)){
    select.innerHTML = '<option>Book data unavailable</option>';
    titleEl.textContent = 'The book could not be loaded';
    errorEl.classList.remove('hidden');
    errorEl.textContent =
      'Please check that smile-chapters.js is in the same folder as read-smile.html and that it contains window.SMILE_BOOK with a chapters array.';
    contentEl.textContent = '';
    return;
  }

  const sections = [];

  if(book.frontMatter){
    sections.push({
      key:'front',
      label:'Opening Pages',
      title:'Opening Pages',
      content:book.frontMatter,
      type:'Front Matter'
    });
  }

  if(book.prologue){
    sections.push({
      key:'prologue',
      label:'Prologue',
      title:'Prologue',
      content:book.prologue,
      type:'Prologue'
    });
  }

  book.chapters.forEach((c,i)=>{
    sections.push({
      key:'chapter-'+i,
      label:'Chapter '+c.number+(c.title?' — '+c.title:''),
      title:c.title||('Chapter '+c.number),
      content:c.content||'',
      type:'Chapter '+c.number
    });
  });

  if(book.epilogue){
    sections.push({
      key:'epilogue',
      label:'Epilogue',
      title:'Epilogue',
      content:book.epilogue,
      type:'Epilogue'
    });
  }

  if(book.backMatter){
    sections.push({
      key:'back',
      label:'Acknowledgements & About the Author',
      title:'Closing Pages',
      content:book.backMatter,
      type:'Back Matter'
    });
  }

  select.innerHTML = '';

  sections.forEach((s,i)=>{
    const option = document.createElement('option');
    option.value = i;
    option.textContent = s.label;
    select.appendChild(option);
  });

  const storageKey = 'blessglow-read-smile-section';
  let current = 0;

  try{
    const saved = Number(localStorage.getItem(storageKey));

    if(
      Number.isInteger(saved) &&
      saved >= 0 &&
      saved < sections.length
    ){
      current = saved;
    }
  }catch(e){}

  function render(){
    const s = sections[current];

    select.value = String(current);
    labelEl.textContent = s.type;
    titleEl.textContent = s.title;
    contentEl.innerHTML = '';

    const blocks = String(s.content)
      .replace(/\r/g,'')
      .split(/\n\s*\n/);

    blocks.forEach(block=>{
      const text = block.trim();

      if(!text) return;

      const p = document.createElement('p');
      p.textContent = text;

      if(
        /^(📖\s*)?(Opening Quote|Final Quote)$/i.test(text) ||
        (/^".*"$/.test(text) && text.length < 400)
      ){
        p.className = 'quote';
      }

      contentEl.appendChild(p);
    });

    prev.disabled = current === 0;
    next.disabled = current === sections.length - 1;

    document.getElementById('progressText').textContent =
      'Section '+(current+1)+' of '+sections.length;

    document.getElementById('positionText').textContent =
      Math.round(((current+1)/sections.length)*100)+'%';

    document.getElementById('progressBar').style.width =
      ((current+1)/sections.length*100)+'%';

    try{
      localStorage.setItem(storageKey,String(current));
    }catch(e){}

    /*
      Unlock the review form when the reader reaches
      the final section of the book.
    */
    if(current === sections.length - 1){
      if(
        window.BlessGlowReviewCompletion &&
        typeof window.BlessGlowReviewCompletion.complete === 'function'
      ){
        window.BlessGlowReviewCompletion.complete();
      }
    }

    window.scrollTo({top:0,behavior:'smooth'});
  }

  select.addEventListener('change',()=>{
    current = Number(select.value);
    render();
  });

  prev.addEventListener('click',()=>{
    if(current > 0){
      current--;
      render();
    }
  });

  next.addEventListener('click',()=>{
    if(current < sections.length - 1){
      current++;
      render();
    }
  });

  render();
})();
</script>

<script src="reviews.js"></script>

</body>
  </html>
