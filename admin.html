
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>World of BlessGlow | Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg:#090909;
  --panel:#141414;
  --panel2:#1b1b1b;
  --gold:#D4AF37;
  --gold2:#F1D77A;
  --text:#f4f0e6;
  --muted:#999;
  --border:#302817;
}

* {box-sizing:border-box;margin:0;padding:0}

body {
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
}

button {font:inherit;cursor:pointer}

/* LOGIN */

#loginPage {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:radial-gradient(ellipse at top,#29200d,transparent 60%),var(--bg);
}

.login-card {
  width:100%;
  max-width:420px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:35px 27px;
  box-shadow:0 20px 70px #0009;
}

.brand {
  color:var(--gold);
  font-family:Georgia,serif;
  font-size:clamp(23px,5vw,31px);
  letter-spacing:2px;
  text-align:center;
  line-height:1.5;
}

.tagline {
  text-align:center;
  color:#b8a77a;
  letter-spacing:3px;
  font-size:10px;
  margin:8px 0 25px;
}

.login-card h1 {
  color:var(--gold2);
  font-family:Georgia,serif;
  font-size:26px;
  font-weight:normal;
  text-align:center;
  margin-bottom:10px;
}

.login-card p {
  color:var(--muted);
  text-align:center;
  font-size:13px;
  line-height:1.6;
  margin-bottom:25px;
}

label {
  display:block;
  color:#d5c69d;
  font-size:12px;
  margin-bottom:8px;
}

.field {margin-bottom:19px}

input {
  width:100%;
  height:47px;
  padding:0 13px;
  background:#090909;
  border:1px solid var(--border);
  border-radius:6px;
  color:white;
  outline:none;
}

input:focus {border-color:var(--gold)}

.password-wrap {position:relative}
.password-wrap input {padding-right:65px}

#togglePassword {
  position:absolute;
  right:12px;
  top:14px;
  border:0;
  background:none;
  color:var(--gold);
}

.gold-button {
  width:100%;
  min-height:47px;
  background:linear-gradient(110deg,#b18a25,#e2c45e);
  color:#100e08;
  border:0;
  border-radius:6px;
  font-weight:bold;
  letter-spacing:1px;
}

.gold-button:disabled {opacity:.6}

.message {
  display:none;
  padding:12px;
  margin-bottom:18px;
  border-radius:6px;
  font-size:13px;
  line-height:1.5;
}

.message.show {display:block}
.message.error {background:#401b1b;color:#ffb1b1}
.message.success {background:#1b301a;color:#d8edbd}

/* DASHBOARD */

#adminApp {display:none;min-height:100vh}

.sidebar {
  position:fixed;
  inset:0 auto 0 0;
  width:255px;
  background:#101010;
  border-right:1px solid var(--border);
  padding:25px 15px;
  overflow-y:auto;
  z-index:20;
}

.side-brand {
  padding:8px 10px 25px;
  border-bottom:1px solid var(--border);
  margin-bottom:23px;
}

.side-brand h2 {
  color:var(--gold);
  font-family:Georgia,serif;
  font-size:19px;
  line-height:1.5;
}

.side-brand p {
  color:#9d8c61;
  font-size:10px;
  letter-spacing:2px;
  margin-top:5px;
}

.nav-label {
  color:#777;
  font-size:10px;
  letter-spacing:2px;
  padding:10px;
}

.nav-item {
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin:3px 0;
  background:transparent;
  border:1px solid transparent;
  border-radius:7px;
  color:#bdbdbd;
  text-align:left;
  font-size:13px;
}

.nav-item:hover,
.nav-item.active {
  background:#241e10;
  border-color:#55421c;
  color:var(--gold2);
}

.nav-icon {
  width:20px;
  text-align:center;
  color:var(--gold);
  font-size:16px;
}

.sidebar-bottom {
  margin-top:30px;
  padding-top:18px;
  border-top:1px solid var(--border);
}

.logout {
  width:100%;
  padding:12px;
  border:1px solid #49332a;
  border-radius:7px;
  color:#e5a19b;
  background:#211513;
}

.main {
  margin-left:255px;
  min-height:100vh;
}

.topbar {
  height:72px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 30px;
  background:#0e0e0e;
  gap:15px;
}

.topbar-title {
  font-family:Georgia,serif;
  color:var(--gold2);
  font-size:19px;
}

.admin-email {
  color:#999;
  font-size:12px;
  overflow-wrap:anywhere;
}

.content {padding:30px}

.welcome h1 {
  font-family:Georgia,serif;
  font-weight:normal;
  color:var(--gold2);
  font-size:30px;
  margin-bottom:9px;
}

.welcome p {
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

.section-title {
  font-family:Georgia,serif;
  font-size:21px;
  color:var(--gold2);
  margin:32px 0 16px;
}

.stats {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
}

.stat-card {
  background:var(--panel);
  border:1px solid var(--border);
  padding:21px;
  border-radius:9px;
  min-width:0;
}

.stat-card span {
  color:var(--muted);
  font-size:12px;
}

.stat-card strong {
  display:block;
  color:var(--gold);
  font-family:Georgia,serif;
  font-size:26px;
  margin-top:13px;
}

.stat-card small {
  display:block;
  color:#777;
  font-size:10px;
  margin-top:8px;
}

.module-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}

.module-card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:9px;
  padding:20px;
  text-align:left;
  color:var(--text);
  transition:.2s;
}

.module-card:hover {
  border-color:var(--gold);
  background:#1d1a12;
}

.module-card .symbol {
  font-size:23px;
  color:var(--gold);
  display:block;
  margin-bottom:15px;
}

.module-card h3 {
  color:var(--gold2);
  font-family:Georgia,serif;
  font-size:17px;
  font-weight:normal;
  margin-bottom:9px;
}

.module-card p {
  color:#999;
  font-size:12px;
  line-height:1.6;
}

.module-status {
  display:inline-block;
  margin-top:15px;
  font-size:10px;
  color:#bba96f;
  border:1px solid var(--border);
  border-radius:20px;
  padding:5px 9px;
}

.page-panel {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:25px;
  margin-top:25px;
}

.page-panel h2 {
  font-family:Georgia,serif;
  color:var(--gold2);
  font-weight:normal;
  margin-bottom:12px;
}

.page-panel p {
  color:#aaa;
  font-size:13px;
  line-height:1.8;
}

#menuButton {
  display:none;
  background:none;
  border:1px solid var(--border);
  color:var(--gold);
  padding:9px 12px;
  border-radius:6px;
}

.overlay {
  display:none;
}

@media(max-width:1000px) {
  .stats {grid-template-columns:repeat(2,1fr)}
  .module-grid {grid-template-columns:repeat(2,1fr)}
}

@media(max-width:700px) {
  .sidebar {
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open {transform:translateX(0)}

  .main {margin-left:0}

  #menuButton {display:block}

  .topbar {padding:0 15px}

  .content {padding:20px 15px}

  .welcome h1 {font-size:25px}

  .module-grid {grid-template-columns:1fr}

  .overlay.show {
    display:block;
    position:fixed;
    inset:0;
    background:#0009;
    z-index:10;
  }

  .admin-email {display:none}
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginPage">
  <div class="login-card">
    <div class="brand">WORLD OF BLESSGLOW</div>
    <div class="tagline">STORIES. WORLDS. IMAGINATION.</div>

    <h1>Admin Portal</h1>
    <p>Your private publishing and administration centre.</p>

    <div id="loginMessage" class="message" role="alert"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">ADMIN EMAIL</label>
        <input id="email" type="email"
          autocomplete="username" required
          placeholder="Enter your email">
      </div>

      <div class="field">
        <label for="password">PASSWORD</label>
        <div class="password-wrap">
          <input id="password" type="password"
            autocomplete="current-password"
            required placeholder="Enter your password">
          <button type="button" id="togglePassword">Show</button>
        </div>
      </div>

      <button class="gold-button" id="loginButton" type="submit">
        SIGN IN
      </button>
    </form>
  </div>
</section>

<!-- ADMIN APPLICATION -->

<div id="adminApp">

  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">

    <div class="side-brand">
      <h2>WORLD OF BLESSGLOW</h2>
      <p>ADMIN CONTROL CENTRE</p>
    </div>

    <div class="nav-label">MAIN MENU</div>

    <button class="nav-item active" data-page="overview">
      <span class="nav-icon">⌂</span> Overview
    </button>

    <button class="nav-item" data-page="books">
      <span class="nav-icon">▤</span> Books & Stories
    </button>

    <button class="nav-item" data-page="chapters">
      <span class="nav-icon">▣</span> Chapter Studio
    </button>

    <button class="nav-item" data-page="frontmatter">
      <span class="nav-icon">▧</span> Front Matter
    </button>

    <div class="nav-label">CONTENT MANAGEMENT</div>

    <button class="nav-item" data-page="media">
      <span class="nav-icon">▧</span> Media Library
    </button>

    <button class="nav-item" data-page="reviews">
      <span class="nav-icon">☆</span> Review Centre
    </button>

    <button class="nav-item" data-page="homepage">
      <span class="nav-icon">⌘</span> Homepage Manager
    </button>

    <button class="nav-item" data-page="genres">
      <span class="nav-icon">◈</span> Genres & Categories
    </button>

    <button class="nav-item" data-page="notifications">
      <span class="nav-icon">♧</span> Notifications
    </button>

    <div class="nav-label">SYSTEM</div>

    <button class="nav-item" data-page="settings">
      <span class="nav-icon">⚙</span> Website Settings
    </button>

    <button class="nav-item" data-page="security">
      <span class="nav-icon">◇</span> Admin Security
    </button>

    <div class="sidebar-bottom">
      <button class="logout" id="logoutButton">↪ Sign Out</button>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">
      <div style="display:flex;align-items:center;gap:13px">
        <button id="menuButton">☰</button>
        <div class="topbar-title">Admin Control Centre</div>
      </div>
      <div class="admin-email" id="adminEmail"></div>
    </header>

    <div class="content" id="pageContent"></div>

  </main>
</div>

<script>
/* ========================================
   WORLD OF BLESSGLOW
   ADMIN CONTROL CENTRE
======================================== */

const SUPABASE_URL =
"https://zngagaolaiidgyxoldsh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_e0wd6fhM_Fr7gsKkKzT2RA_vAReV50F";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

const loginPage = document.getElementById("loginPage");
const adminApp = document.getElementById("adminApp");
const loginMessage = document.getElementById("loginMessage");
const loginButton = document.getElementById("loginButton");

let currentUser = null;
let initialized = false;

/* AUTHORIZATION */

function isAdmin(user) {
  const metadata = user?.app_metadata || {};

  return metadata.role === "admin" ||
    (Array.isArray(metadata.roles) &&
     metadata.roles.includes("admin"));
}

function showError(text) {
  loginMessage.textContent = text;
  loginMessage.className = "message show error";
}

function showApp(user) {
  currentUser = user;
  loginPage.style.display = "none";
  adminApp.style.display = "block";

  document.getElementById("adminEmail").textContent =
    user.email || "Administrator";

  renderPage("overview");
}

function showLogin() {
  currentUser = null;
  adminApp.style.display = "none";
  loginPage.style.display = "flex";
}

/* PASSWORD VISIBILITY */

document.getElementById("togglePassword")
.addEventListener("click", function() {
  const field = document.getElementById("password");
  const show = field.type === "password";

  field.type = show ? "text" : "password";
  this.textContent = show ? "Hide" : "Show";
});

/* LOGIN */

document.getElementById("loginForm")
.addEventListener("submit", async event => {

  event.preventDefault();

  loginMessage.className = "message";
  loginButton.disabled = true;
  loginButton.textContent = "SIGNING IN...";

  try {
    const {data,error} = await db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    if (error) throw error;

    if (!isAdmin(data.user)) {
      await db.auth.signOut();
      throw new Error(
        "Administrator access is not assigned to this account."
      );
    }

    showApp(data.user);

  } catch(error) {
    showError(error.message || "Unable to sign in.");
  } finally {
    loginButton.disabled = false;
    loginButton.textContent = "SIGN IN";
  }
});

/* SESSION */

async function initialize() {
  const {data,error} = await db.auth.getUser();

  if (!error && data.user && isAdmin(data.user)) {
    showApp(data.user);
  } else {
    showLogin();
  }

  initialized = true;
}

/* AUTH EVENTS */

db.auth.onAuthStateChange((event,session) => {

  if (!initialized) return;

  if (event === "SIGNED_OUT" || !session) {
    showLogin();
  }

  if (event === "TOKEN_REFRESHED" && session?.user) {
    currentUser = session.user;
  }

});

/* NAVIGATION */

const pages = {
  overview: {
    title:"Dashboard Overview",
    description:"Welcome to your World of BlessGlow publishing control centre."
  },
  books:{
    title:"Books & Stories",
    description:"Manage your books, story descriptions, covers, genres and publishing status."
  },
  chapters:{
    title:"Chapter Studio",
    description:"Create, edit, organize and publish chapters for your stories."
  },
  frontmatter:{
    title:"Front Matter",
    description:"Manage title pages, introductions, copyright, disclaimers, dedications and acknowledgements."
  },
  media:{
    title:"Media Library",
    description:"Manage book covers and other images used throughout your website."
  },
  reviews:{
    title:"Review Centre",
    description:"Manage reader reviews, ratings, pending submissions and approved reviews."
  },
  homepage:{
    title:"Homepage Manager",
    description:"Control featured books, new releases, editor's picks and homepage sections."
  },
  genres:{
    title:"Genres & Categories",
    description:"Manage your main genres and their subgenres."
  },
  notifications:{
    title:"Notifications",
    description:"Manage reader interest notifications and upcoming book announcements."
  },
  settings:{
    title:"Website Settings",
    description:"Manage your website's publishing and display preferences."
  },
  security:{
    title:"Admin Security",
    description:"Manage administrator access and account security."
  }
};

const symbols = {
  books:"▤",
  chapters:"▣",
  frontmatter:"▧",
  media:"▧",
  reviews:"☆",
  homepage:"⌂",
  genres:"◈",
  notifications:"♧",
  settings:"⚙",
  security:"◇"
};

function renderPage(page) {

  const info = pages[page] || pages.overview;

  document.querySelectorAll(".nav-item").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.page === page
    );
  });

  const content = document.getElementById("pageContent");

  if (page === "overview") {

    content.innerHTML = `
      <section class="welcome">
        <h1>Welcome to World of BlessGlow</h1>
        <p>Your stories, publishing tools and website management in one place.</p>
      </section>

      <h2 class="section-title">Publishing Overview</h2>

      <div class="stats">
        <div class="stat-card">
          <span>Total Books</span>
          <strong>—</strong>
          <small>Database connection pending</small>
        </div>
        <div class="stat-card">
          <span>Ongoing Stories</span>
          <strong>—</strong>
          <small>Database connection pending</small>
        </div>
        <div class="stat-card">
          <span>Published Chapters</span>
          <strong>—</strong>
          <small>Database connection pending</small>
        </div>
        <div class="stat-card">
          <span>Pending Reviews</span>
          <strong>—</strong>
          <small>Database connection pending</small>
        </div>
      </div>

      <h2 class="section-title">Management Centre</h2>

      <div class="module-grid">
        ${Object.entries(pages).filter(([key]) => key !== "overview")
          .map(([key,item]) => `
            <button class="module-card" data-open="${key}">
              <span class="symbol">${symbols[key]}</span>
              <h3>${item.title}</h3>
              <p>${item.description}</p>
              <span class="module-status">Module setup pending</span>
            </button>
          `).join("")}
      </div>
    `;

  } else {

    content.innerHTML = `
      <section class="welcome">
        <h1>${info.title}</h1>
        <p>${info.description}</p>
      </section>

      <div class="page-panel">
        <h2>${info.title}</h2>
        <p>
          This management module has its own implementation stage.
          Its database and storage operations will be connected and
          tested before it is marked as ready.
        </p>
        <p style="margin-top:15px;color:#bba96f">
          Status: Module not connected yet.
        </p>
      </div>
    `;

  }

  content.querySelectorAll("[data-open]").forEach(button => {
    button.addEventListener("click", () => {
      renderPage(button.dataset.open);
    });
  });

  closeMenu();
}

/* SIDEBAR EVENTS */

document.querySelectorAll(".nav-item").forEach(button => {
  button.addEventListener("click", () => {
    renderPage(button.dataset.page);
  });
});

/* MOBILE MENU */

const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

function closeMenu() {
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
}

document.getElementById("menuButton")
.addEventListener("click", () => {
  sidebar.classList.toggle("open");
  overlay.classList.toggle("show");
});

overlay.addEventListener("click", closeMenu);

/* LOGOUT */

document.getElementById("logoutButton")
.addEventListener("click", async () => {
  const {error} = await db.auth.signOut();

  if (error) {
    alert("Sign out failed: " + error.message);
  }
});

/* START */

initialize();

</script>

</body>
          </html>
