
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>World of BlessGlow | Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg:#090909;
  --panel:#141414;
  --panel2:#1b1b1b;
  --gold:#D4AF37;
  --gold2:#F1D77A;
  --text:#f4f0e6;
  --muted:#999;
  --border:#302817;
}
* {box-sizing:border-box;margin:0;padding:0}
body {
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
}
button {font:inherit;cursor:pointer}
#loginPage {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:radial-gradient(ellipse at top,#29200d,transparent 60%),var(--bg);
}
.login-card {
  width:100%;
  max-width:420px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:35px 27px;
  box-shadow:0 20px 70px #0009;
}
.brand {
  color:var(--gold);
  font-family:Georgia,serif;
  font-size:clamp(23px,5vw,31px);
  letter-spacing:2px;
  text-align:center;
  line-height:1.5;
}
.tagline {
  text-align:center;
  color:#b8a77a;
  letter-spacing:3px;
  font-size:10px;
  margin:8px 0 25px;
}
.login-card h1 {
  color:var(--gold2);
  font-family:Georgia,serif;
  font-size:26px;
  font-weight:normal;
  text-align:center;
  margin-bottom:10px;
}
.login-card p {
  color:var(--muted);
  text-align:center;
  font-size:13px;
  line-height:1.6;
  margin-bottom:25px;
}
label {
  display:block;
  color:#d5c69d;
  font-size:12px;
  margin-bottom:8px;
}
.field {margin-bottom:19px}
input,select,textarea {
  width:100%;
  padding:12px 13px;
  background:#090909;
  border:1px solid var(--border);
  border-radius:6px;
  color:white;
  outline:none;
  font:inherit;
  font-size:13px;
}
input {height:47px}
textarea {min-height:110px;resize:vertical;line-height:1.6}
select {height:47px}
input:focus,select:focus,textarea:focus {border-color:var(--gold)}
input[type="checkbox"] {
  width:17px;
  height:17px;
  accent-color:var(--gold);
}
.password-wrap {position:relative}
.password-wrap input {padding-right:65px}
#togglePassword {
  position:absolute;
  right:12px;
  top:14px;
  border:0;
  background:none;
  color:var(--gold);
}
.gold-button {
  width:100%;
  min-height:47px;
  background:linear-gradient(110deg,#b18a25,#e2c45e);
  color:#100e08;
  border:0;
  border-radius:6px;
  font-weight:bold;
  letter-spacing:1px;
}
.gold-button:disabled {opacity:.6;cursor:wait}
.message {
  display:none;
  padding:12px;
  margin-bottom:18px;
  border-radius:6px;
  font-size:13px;
  line-height:1.5;
}
.message.show {display:block}
.message.error {background:#401b1b;color:#ffb1b1}
.message.success {background:#1b301a;color:#d8edbd}

/* DASHBOARD */

#adminApp {display:none;min-height:100vh}
.sidebar {
  position:fixed;
  inset:0 auto 0 0;
  width:255px;
  background:#101010;
  border-right:1px solid var(--border);
  padding:25px 15px;
  overflow-y:auto;
  z-index:20;
}
.side-brand {
  padding:8px 10px 25px;
  border-bottom:1px solid var(--border);
  margin-bottom:23px;
}
.side-brand h2 {
  color:var(--gold);
  font-family:Georgia,serif;
  font-size:19px;
  line-height:1.5;
}
.side-brand p {
  color:#9d8c61;
  font-size:10px;
  letter-spacing:2px;
  margin-top:5px;
}
.nav-label {
  color:#777;
  font-size:10px;
  letter-spacing:2px;
  padding:10px;
}
.nav-item {
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin:3px 0;
  background:transparent;
  border:1px solid transparent;
  border-radius:7px;
  color:#bdbdbd;
  text-align:left;
  font-size:13px;
}
.nav-item:hover,.nav-item.active {
  background:#241e10;
  border-color:#55421c;
  color:var(--gold2);
}
.nav-icon {
  width:20px;
  text-align:center;
  color:var(--gold);
  font-size:16px;
}
.sidebar-bottom {
  margin-top:30px;
  padding-top:18px;
  border-top:1px solid var(--border);
}
.logout {
  width:100%;
  padding:12px;
  border:1px solid #49332a;
  border-radius:7px;
  color:#e5a19b;
  background:#211513;
}
.main {margin-left:255px;min-height:100vh}
.topbar {
  min-height:72px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 30px;
  background:#0e0e0e;
  gap:15px;
}
.topbar-title {
  font-family:Georgia,serif;
  color:var(--gold2);
  font-size:19px;
}
.admin-email {
  color:#999;
  font-size:12px;
  overflow-wrap:anywhere;
}
.content {padding:30px}
.welcome h1 {
  font-family:Georgia,serif;
  font-weight:normal;
  color:var(--gold2);
  font-size:30px;
  margin-bottom:9px;
}
.welcome p {
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}
.section-title {
  font-family:Georgia,serif;
  font-size:21px;
  color:var(--gold2);
  margin:32px 0 16px;
}
.stats {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
}
.stat-card {
  background:var(--panel);
  border:1px solid var(--border);
  padding:21px;
  border-radius:9px;
  min-width:0;
}
.stat-card span {color:var(--muted);font-size:12px}
.stat-card strong {
  display:block;
  color:var(--gold);
  font-family:Georgia,serif;
  font-size:26px;
  margin-top:13px;
}
.stat-card small {
  display:block;
  color:#777;
  font-size:10px;
  margin-top:8px;
}
.module-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}
.module-card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:9px;
  padding:20px;
  text-align:left;
  color:var(--text);
  transition:.2s;
}
.module-card:hover {
  border-color:var(--gold);
  background:#1d1a12;
}
.module-card .symbol {
  font-size:23px;
  color:var(--gold);
  display:block;
  margin-bottom:15px;
}
.module-card h3 {
  color:var(--gold2);
  font-family:Georgia,serif;
  font-size:17px;
  font-weight:normal;
  margin-bottom:9px;
}
.module-card p {
  color:#999;
  font-size:12px;
  line-height:1.6;
}
.module-status {
  display:inline-block;
  margin-top:15px;
  font-size:10px;
  color:#bba96f;
  border:1px solid var(--border);
  border-radius:20px;
  padding:5px 9px;
}
.page-panel {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:25px;
  margin-top:25px;
}
.page-panel h2 {
  font-family:Georgia,serif;
  color:var(--gold2);
  font-weight:normal;
  margin-bottom:12px;
}
.page-panel p {
  color:#aaa;
  font-size:13px;
  line-height:1.8;
}
#menuButton {
  display:none;
  background:none;
  border:1px solid var(--border);
  color:var(--gold);
  padding:9px 12px;
  border-radius:6px;
}
.overlay {display:none}

/* BOOKS MODULE */

.books-toolbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin:25px 0 18px;
}
.books-actions {
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}
.action-button {
  border:1px solid #59451d;
  background:#211b0e;
  color:var(--gold2);
  padding:11px 15px;
  border-radius:6px;
  font-size:12px;
}
.action-button:hover {border-color:var(--gold)}
.action-button.primary {
  background:linear-gradient(110deg,#b18a25,#e2c45e);
  color:#100e08;
  font-weight:bold;
  border:0;
}
.action-button.danger {
  border-color:#65332e;
  background:#281614;
  color:#e9aaa3;
}
.action-button:disabled {opacity:.5;cursor:wait}
.books-filter {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.books-filter select {min-width:150px}
.books-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}
.book-card {
  display:flex;
  gap:15px;
  padding:15px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:9px;
  min-width:0;
}
.book-cover {
  width:105px;
  min-width:105px;
  height:145px;
  object-fit:cover;
  background:#080808;
  border:1px solid #40351e;
  border-radius:5px;
}
.book-cover-empty {
  width:105px;
  min-width:105px;
  height:145px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#806c37;
  background:#0a0a0a;
  border:1px solid var(--border);
  border-radius:5px;
  font-family:Georgia,serif;
  font-size:12px;
  padding:8px;
}
.book-info {min-width:0;flex:1}
.book-info h3 {
  color:var(--gold2);
  font-family:Georgia,serif;
  font-size:17px;
  font-weight:normal;
  overflow-wrap:anywhere;
  margin:3px 0 7px;
}
.book-info p {
  color:#999;
  font-size:11px;
  line-height:1.6;
  overflow-wrap:anywhere;
}
.book-tags {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:9px 0;
}
.book-tag {
  border:1px solid var(--border);
  border-radius:20px;
  padding:4px 7px;
  color:#c5b47f;
  font-size:9px;
}
.book-buttons {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:12px;
}
.book-buttons button {
  padding:7px 9px;
  font-size:10px;
  border-radius:5px;
  border:1px solid var(--border);
  color:var(--gold2);
  background:#1c190f;
}
.book-buttons button.trash {
  color:#e9aaa3;
  border-color:#54302b;
  background:#211413;
}
.book-empty {
  grid-column:1/-1;
  padding:35px 20px;
  text-align:center;
  color:#999;
  background:var(--panel);
  border:1px dashed var(--border);
  border-radius:9px;
  font-size:13px;
  line-height:1.8;
}
.module-message {
  display:none;
  padding:12px 14px;
  border-radius:6px;
  font-size:12px;
  line-height:1.6;
  margin:15px 0;
}
.module-message.show {display:block}
.module-message.error {background:#401b1b;color:#ffb1b1}
.module-message.success {background:#1b301a;color:#d8edbd}
.module-message.info {background:#252014;color:#e4d19a}

/* BOOK EDITOR */

.editor-panel {
  display:none;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:22px;
  margin-top:20px;
}
.editor-panel.open {display:block}
.editor-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}
.editor-heading h2 {
  font-family:Georgia,serif;
  color:var(--gold2);
  font-weight:normal;
  font-size:21px;
}
.editor-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}
.editor-field {min-width:0}
.editor-field.full {grid-column:1/-1}
.editor-field small {
  display:block;
  color:#888;
  font-size:10px;
  line-height:1.6;
  margin-top:6px;
}
.editor-field input[type="file"] {
  height:auto;
  padding:10px;
}
.cover-preview-wrap {
  display:flex;
  align-items:flex-start;
  gap:15px;
  flex-wrap:wrap;
  margin-top:10px;
}
#coverPreview {
  width:110px;
  height:150px;
  object-fit:cover;
  background:#080808;
  border:1px solid var(--border);
  border-radius:5px;
  display:none;
}
.check-options {
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  margin-top:7px;
}
.check-option {
  display:flex;
  align-items:center;
  gap:8px;
  color:#d5c69d;
  font-size:12px;
}
.check-option label {margin:0}
.editor-footer {
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:22px;
  flex-wrap:wrap;
}
.editor-footer button {width:auto;min-width:130px}
.loading-note {
  color:#bba96f;
  font-size:12px;
  padding:15px 0;
}

@media(max-width:1100px) {
  .books-grid {grid-template-columns:1fr}
}
@media(max-width:1000px) {
  .stats {grid-template-columns:repeat(2,1fr)}
  .module-grid {grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px) {
  .sidebar {
    transform:translateX(-100%);
    transition:.25s;
  }
  .sidebar.open {transform:translateX(0)}
  .main {margin-left:0}
  #menuButton {display:block}
  .topbar {padding:0 15px}
  .content {padding:20px 15px}
  .welcome h1 {font-size:25px}
  .module-grid {grid-template-columns:1fr}
  .overlay.show {
    display:block;
    position:fixed;
    inset:0;
    background:#0009;
    z-index:10;
  }
  .admin-email {display:none}
  .editor-grid {grid-template-columns:1fr}
  .editor-field.full {grid-column:auto}
  .book-card {gap:10px;padding:11px}
  .book-cover,.book-cover-empty {
    width:85px;
    min-width:85px;
    height:120px;
  }
  .book-info h3 {font-size:15px}
  .editor-panel {padding:15px}
}
</style>
</head>

<body>

<section id="loginPage">
  <div class="login-card">
    <div class="brand">WORLD OF BLESSGLOW</div>

        SIGN IN
      </button>

</section>

<div id="adminApp">
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <h2>WORLD OF BLESSGLOW</h2>
      <p>ADMIN CONTROL CENTRE</p>
    </div>

    <div class="nav-label">MAIN MENU</div>

    <button class="nav-item active" data-page="overview">
      <span class="nav-icon">⌂</span> Overview
    </button>
    <button class="nav-item" data-page="books">
      <span class="nav-icon">▤</span> Books & Stories
    </button>
    <button class="nav-item" data-page="chapters">
      <span class="nav-icon">▣</span> Chapter Studio
    </button>
    <button class="nav-item" data-page="frontmatter">
      <span class="nav-icon">▧</span> Front Matter
    </button>

    <div class="nav-label">CONTENT MANAGEMENT</div>

    <button class="nav-item" data-page="media">
      <span class="nav-icon">▧</span> Media Library
    </button>
    <button class="nav-item" data-page="reviews">
      <span class="nav-icon">☆</span> Review Centre
    </button>
    <button class="nav-item" data-page="homepage">
      <span class="nav-icon">⌘</span> Homepage Manager
    </button>
    <button class="nav-item" data-page="genres">
      <span class="nav-icon">◈</span> Genres & Categories
    </button>
    <button class="nav-item" data-page="notifications">
      <span class="nav-icon">♧</span> Notifications
    </button>

    <button class="nav-item" data-page="settings">
      <span class="nav-icon">⚙</span> Website Settings

      <span class="nav-icon">◇</span> Admin Security

      <button class="logout" id="logoutButton">↪ Sign Out</button>
    </div>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:13px">
        <button id="menuButton">☰</button>
        <div class="topbar-title">Admin Control Centre</div>
      </div>
      <div class="admin-email" id="adminEmail"></div>
    </header>
    <div class="content" id="pageContent"></div>
  </main>
</div>

<script>
/* ========================================
   WORLD OF BLESSGLOW
   ADMIN CONTROL CENTRE
======================================== */

const SUPABASE_URL =
"https://zngagaolaiidgyxoldsh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_e0wd6fhM_Fr7gsKkKzT2RA_vAReV50F";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const loginPage = document.getElementById("loginPage");
const adminApp = document.getElementById("adminApp");
const loginMessage = document.getElementById("loginMessage");
const loginButton = document.getElementById("loginButton");

let currentUser = null;
let initialized = false;
let currentBookRows = [];
let currentBookFilter = "active";
let coverFile = null;
let coverPreviewReader = null;

/* ADMIN AUTHORIZATION */

function isAdmin(user) {
  const metadata = user?.app_metadata || {};

  return metadata.role === "admin" ||
    (Array.isArray(metadata.roles) &&
     metadata.roles.includes("admin"));
}

function showError(text) {
  loginMessage.textContent = text;
  loginMessage.className = "message show error";
}

function showApp(user) {
  currentUser = user;
  loginPage.style.display = "none";
  adminApp.style.display = "block";
  document.getElementById("adminEmail").textContent =
    user.email || "Administrator";
  renderPage("overview");
}

function showLogin() {
  currentUser = null;
  adminApp.style.display = "none";
  loginPage.style.display = "flex";
}

document.getElementById("togglePassword")
.addEventListener("click",function() {
  const field = document.getElementById("password");
  const show = field.type === "password";
  field.type = show ? "text" : "password";
  this.textContent = show ? "Hide" : "Show";
});

document.getElementById("loginForm")
.addEventListener("submit",async event => {
  event.preventDefault();
  loginMessage.className = "message";
  loginButton.disabled = true;
  loginButton.textContent = "SIGNING IN...";

  try {
    const {data,error} = await db.auth.signInWithPassword({
      email:document.getElementById("email").value.trim(),
      password:document.getElementById("password").value
    });

    if (error) throw error;

    if (!isAdmin(data.user)) {
      await db.auth.signOut();
      throw new Error(
        "Administrator access is not assigned to this account."
      );
    }

    showApp(data.user);
  } catch(error) {
    showError(error.message || "Unable to sign in.");
  } finally {
    loginButton.disabled = false;
    loginButton.textContent = "SIGN IN";
  }
});

async function initialize() {
  const {data,error} = await db.auth.getUser();

  if (!error && data.user && isAdmin(data.user)) {
    showApp(data.user);
  } else {
    showLogin();
  }

  initialized = true;
}

db.auth.onAuthStateChange((event,session) => {
  if (!initialized) return;

  if (event === "SIGNED_OUT" || !session) {
    showLogin();
  }

  if (event === "TOKEN_REFRESHED" && session?.user) {
    currentUser = session.user;
  }
});

/* PAGE INFORMATION */

const pages = {
  overview:{
    title:"Dashboard Overview",
    description:"Welcome to your World of BlessGlow publishing control centre."
  },
  books:{
    title:"Books & Stories",
    description:"Manage your books, story descriptions, covers, genres and publishing status."
  },
  chapters:{
    title:"Chapter Studio",
    description:"Create, edit, organize and publish chapters for your stories."
  },
  frontmatter:{
    title:"Front Matter",
    description:"Manage title pages, introductions, copyright, disclaimers, dedications and acknowledgements."
  },
  media:{
    title:"Media Library",
    description:"Manage book covers and other images used throughout your website."
  },
  reviews:{
    title:"Review Centre",
    description:"Manage reader reviews, ratings, pending submissions and approved reviews."
  },
  homepage:{
    title:"Homepage Manager",
    description:"Control featured books, new releases, editor's picks and homepage sections."
  },
  genres:{
    title:"Genres & Categories",
    description:"Manage your main genres and their subgenres."
  },
  notifications:{
    title:"Notifications",
    description:"Manage reader interest notifications and upcoming book announcements."
  },
  settings:{

/* GENERAL HELPERS */

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g,char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function slugify(value) {
  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}

function formatStatus(status) {
  const labels = {
    draft:"Draft",
    coming_soon:"Coming Soon",
    ongoing:"Ongoing",
    completed:"Completed",
    published:"Published",
    archived:"Archived"
  };
  return labels[status] || status || "Unknown";
}

function showBookMessage(message,type="info") {
  const box = document.getElementById("booksMessage");
  if (!box) return;
  box.textContent = message;
  box.className = "module-message show " + type;
  }
  function clearBookMessage() {
  const box = document.getElementById("booksMessage");
  if (box) box.className = "module-message";
}

function getGenreOptions(selected="") {
  return genreNames.map(name =>
    `<option value="${escapeHTML(name)}"
      ${name === selected ? "selected" : ""}>
      ${escapeHTML(name)}
    </option>`
  ).join("");
}

function getSubgenreOptions(genre,selected="") {
  const options = genreData[genre] || [];
  let html = `<option value="">Select a subgenre</option>`;

  if (selected && !options.includes(selected)) {
    html += `<option value="${escapeHTML(selected)}" selected>
      ${escapeHTML(selected)} (existing value)
    </option>`;
  }
    html += options.map(name =>
    `<option value="${escapeHTML(name)}"
      ${name === selected ? "selected" : ""}>
      ${escapeHTML(name)}
    </option>`
  ).join("");

  return html;
}

/* LOAD BOOKS */

async function loadBooks() {
  const list = document.getElementById("booksList");
  if (!list) return;list.innerHTML = `<div class="book-empty">Loading books...</div>`;
  clearBookMessage();

  try {
    let query = db.from("books").select("*");

    if (currentBookFilter === "trash") {
      query = query.not("deleted_at","is",null);
    } else {
      query = query.is("deleted_at",null);
    }

    const {data,error} = await query
      .order("display_order",{ascending:true})
      .order("created_at",{ascending:true});

    if (error) throw error;

    currentBookRows = data || [];

    const statusFilter =
      document.getElementById("bookStatusFilter")?.value || "";

    let visibleBooks = currentBookRows;

    if (statusFilter) {
      visibleBooks = visibleBooks.filter(book =>
        book.Publication_status === statusFilter
      );
  }
     if (!visibleBooks.length) {
      list.innerHTML = `
        <div class="book-empty">
          ${currentBookFilter === "trash"
            ? "Your Trash is empty."
            : "No books found. Select Add New Book to create your first book."}
        </div>`;
      return;
    }

    list.innerHTML = visibleBooks.map(book => {
      const cover = book.Cover_url
        ? `<img class="book-cover"
             src="${escapeHTML(book.Cover_url)}"
             alt="${escapeHTML(book.Title)} cover"
             loading="lazy">`
        : `<div class="book-cover-empty">World of BlessGlow</div>`;

      const buttons = currentBookFilter === "trash"
        ? `<button data-restore="${escapeHTML(book.id)}">Restore</button>`
        : `
          <button data-edit="${escapeHTML(book.id)}">Edit</button>
          <button class="trash" data-trash="${escapeHTML(book.id)}">Move to Trash</button>
        `;

      return `
        <article class="book-card">
          ${cover}
          <div class="book-info">
            <h3>${escapeHTML(book.Title || "Untitled Book")}</h3>
            <p>${escapeHTML(book.short_description || book.Description || "No description added yet.")}</p>
            <div class="book-tags">
              <span class="book-tag">${escapeHTML(formatStatus(book.Publication_status))}</span>
              <span class="book-tag">${escapeHTML(book.main_genre || "No genre")}</span> ${book.Subgenre
                ? `<span class="book-tag">${escapeHTML(book.Subgenre)}</span>`
                : ""}
              ${book.is_featured ? `<span class="book-tag">Featured</span>` : ""}
              ${book.is_editors_pick ? `<span class="book-tag">Editor's Pick</span>` : ""}
            </div>
            <p>Slug: ${escapeHTML(book.Slug || "")}</p>
            <div class="book-buttons">${buttons}</div>
          </div>
        </article>
      `;
    }).join("");

    list.querySelectorAll("[data-edit]").forEach(button => {
      button.addEventListener("click",() => {
        const book = currentBookRows.find(
          item => item.id === button.dataset.edit
        );
        if (book) openBookEditor(book);
      });
    });
  list.querySelectorAll("[data-trash]").forEach(button => {
      button.addEventListener("click",() => {
        const book = currentBookRows.find(
          item => item.id === button.dataset.trash
        );
        if (book) moveBookToTrash(book);
      });
    });

    list.querySelectorAll("[data-restore]").forEach(button => {
      button.addEventListener("click",() => {
        const book = currentBookRows.find(
          item => item.id === button.dataset.restore
        );
        if (book) restoreBook(book);
      });
    });

  } catch(error) {
    list.innerHTML = `
      <div class="book-empty">
        Could not load books.<br>
        ${escapeHTML(error.message || "Please try again.")}
      </div>`;
  }
}

/* COVER PREVIEW */

function previewSelectedCover(event) {
  const file = event.target.files?.[0];
  if (!file) return;

  const allowedTypes = [
    "image/jpeg","image/png","image/webp","image/gif"
  ];
  if (!allowedTypes.includes(file.type)) {
    showBookMessage(
      "Please choose a JPG, PNG, WebP or GIF image.",
      "error"
    );
    event.target.value = "";
    return;
  }

  if (file.size > 20 * 1024 * 1024) {
    showBookMessage("The cover image must not exceed 20 MB.","error");
    event.target.value = "";
    return;
  }

  coverFile = file;

  const reader = new FileReader();

  reader.onload = () => {
    const preview = document.getElementById("coverPreview");
    preview.src = reader.result;
    preview.style.display = "block";

    document.getElementById("coverPreviewNote").textContent =
      "New cover preview. It will be uploaded when you save the book.";
  };
  reader.onerror = () => {
    showBookMessage("Could not preview this image. Try another file.","error");
  };

  reader.readAsDataURL(file);
}

/* UPLOAD COVER */

async function uploadBookCover(file) {
  const safeName = file.name
    .toLowerCase()
    .replace(/[^a-z0-9._-]/g,"-")
    .replace(/-+/g,"-");

  const path =
    "covers/" + Date.now() + "-" + safeName;

  const {data,error} = await db.storage
    .from("book-covers")
    .upload(path,file,{
      cacheControl:"3600",
      upsert:false,
      contentType:file.type
    });

  if (error) throw error;

  const publicResult = db.storage
    .from("book-covers")
    .getPublicUrl(data.path);

  const publicUrl = publicResult?.data?.publicUrl;

  if (!publicUrl) {
    throw new Error("The cover uploaded, but its public URL could not be created.");
  }

  return {
    path:data.path,
    url:publicUrl
  };
  }
  /* SAVE BOOK */

async function saveBook(event) {
  event.preventDefault();

  const saveButton = document.getElementById("saveBookButton");
  saveButton.disabled = true;
  saveButton.textContent = "SAVING...";

  let uploadedCoverPath = null;

  try {
    const id = document.getElementById("bookId").value;
    const title = document.getElementById("bookTitle").value.trim();
    const slug = slugify(
      document.getElementById("bookSlug").value
    );

    const genre = document.getElementById("bookGenre").value;
    const subgenre = document.getElementById("bookSubgenre").value;

    if (!title) throw new Error("Please enter the book title.");
    if (!slug) throw new Error("Please enter a valid book slug.");
    if (!genre) throw new Error("Please select a main genre.");
    if (!subgenre) throw new Error("Please select a subgenre.");

    const existingBook = id
      ? currentBookRows.find(book => book.id === id)
      : null;

    let coverUrl = existingBook?.Cover_url || null;

    if (coverFile) {
      showBookMessage("Uploading your book cover...","info");const uploaded = await uploadBookCover(coverFile);
      uploadedCoverPath = uploaded.path;
      coverUrl = uploaded.url;
    }

    const bookData = {
      Title:title,
      Slug:slug,
      Description:document.getElementById("bookDescription").value.trim(),
      short_description:document.getElementById("bookShortDescription").value.trim(),
      Cover_url:coverUrl,
      main_genre:genre,
      Subgenre:subgenre,
      Publication_status:document.getElementById("bookStatus").value,
      Release_date:document.getElementById("bookReleaseDate").value || null,
      Allow_free_interest:document.getElementById("bookFreeInterest").checked,
      allow_preorder:document.getElementById("bookPreorder").checked,
      is_featured:document.getElementById("bookFeatured").checked,
      is_editors_pick:document.getElementById("bookEditorsPick").checked,
      display_order:Number(
        document.getElementById("bookOrder").value || 0
      ),
      updated_at:new Date().toISOString()
    };
  let result;

    if (id) {
      result = await db.from("books")
        .update(bookData)
        .eq("id",id)
        .select()
        .single();
    } else {
      result = await db.from("books")
        .insert(bookData)
        .select()
        .single();
    }

    if (result.error) throw result.error;

    showBookMessage(
      id ? "Book updated successfully." : "New book saved successfully.",
      "success"
    );

    closeBookEditor();
    await loadBooks();

  } catch(error) {
    if (uploadedCoverPath) {
      await db.storage.from("book-covers").remove([uploadedCoverPath]);
    }

    showBookMessage(
      error.message || "Could not save the book. Please try again.",
      "error"
    );
    } finally {
    saveButton.disabled = false;
    saveButton.textContent = "SAVE BOOK";
    coverFile = null;
  }
}

/* MOVE BOOK AND ITS ACTIVE CHAPTERS TO TRASH */

async function moveBookToTrash(book) {
  const confirmed = confirm(
    `Move "${book.Title}" to Trash?\n\nIts active chapters will also be moved to Trash. You can restore the book later.`
  );

  if (!confirmed) return;

  try {
    const deletionTime = new Date().toISOString();

    const chapterResult = await db.from("chapters")
      .update({deleted_at:deletionTime})
      .eq("book_id",book.id)
      .is("deleted_at",null);

    if (chapterResult.error) {
      throw new Error(
        "The chapters could not be moved to Trash. The book was not moved. " +
        chapterResult.error.message
      );
    }

    const bookResult = await db.from("books")
      .update({deleted_at:deletionTime})
      .eq("id",book.id);

    if (bookResult.error) {
      await db.from("chapters")
        .update({deleted_at:null})
        .eq("book_id",book.id)
        .eq("deleted_at",deletionTime);
   throw bookResult.error;
    }

    showBookMessage(
      "Book and its active chapters moved to Trash.",
      "success"
    );

    await loadBooks();

  } catch(error) {
    showBookMessage(
      error.message || "Could not move the book to Trash.",
      "error"
    );
  }
}

/* RESTORE BOOK AND CHAPTERS MOVED WITH IT */

async function restoreBook(book) {
  const confirmed = confirm(
    `Restore "${book.Title}" and the chapters moved to Trash with it?`
  );

  if (!confirmed) return;

  try {
    const deletionTime = book.deleted_at;

    const bookResult = await db.from("books")
      .update({deleted_at:null})
      .eq("id",book.id);

    if (bookResult.error) throw bookResult.error;

    const chapterResult = await db.from("chapters")
      .update({deleted_at:null})
      .eq("book_id",book.id)
      .eq("deleted_at",deletionTime);

    if (chapterResult.error) {
      showBookMessage(
        "The book was restored, but some chapters could not be restored: " +
        chapterResult.error.message,
        "error"
      );
      await loadBooks();
      return;
  }
  showBookMessage("Book and its associated chapters restored.","success");
    await loadBooks();

  } catch(error) {
    showBookMessage(
      error.message || "Could not restore the book.",
      "error"
    );
  }
}
