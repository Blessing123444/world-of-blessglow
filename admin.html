
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<title>World of BlessGlow | Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{--bg:#0b0b0b;--panel:#151515;--gold:#d4af37;--text:#eee;--muted:#aaa;--border:#302817;--red:#d65b5b;--green:#58b987}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:22px 5%;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:15px}
header h2{color:var(--gold);margin:0;font-size:21px}
button,input,textarea,select{font:inherit}
button{background:var(--gold);color:#111;border:0;padding:11px 16px;border-radius:6px;cursor:pointer;font-weight:bold}
button.secondary{background:#292929;color:#eee;border:1px solid var(--border)}
button.danger{background:#702d2d;color:white}
button:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1150px;margin:28px auto;padding:0 16px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;margin-bottom:22px}
h2,h3{color:var(--gold)}
h3{margin-top:0}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input,textarea,select{width:100%;padding:12px;background:#090909;color:white;border:1px solid #393939;border-radius:6px}
textarea{min-height:110px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.checks{display:flex;flex-wrap:wrap;gap:18px;margin:16px 0}
.checks label{display:flex;align-items:center;gap:7px;margin:0}
.checks input{width:auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tabs button{background:#222;color:#ddd;border:1px solid var(--border)}
.tabs button.active{background:var(--gold);color:#111}
.item{padding:15px 0;border-bottom:1px solid var(--border)}
.item:last-child{border:0}
.item strong{color:var(--gold)}
.item small{display:block;color:var(--muted);margin:6px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.status{color:var(--gold);font-size:12px;text-transform:uppercase}
.hidden{display:none!important}
.message{color:var(--gold);margin-top:12px}
#login{max-width:420px;margin:70px auto}
#login h2{text-align:center}
#coverPreview{max-width:130px;max-height:160px;object-fit:cover;margin-top:10px;display:none}
.review-answer{margin:10px 0;padding:10px;background:#101010;border-radius:6px}
.review-answer b{color:var(--gold)}
@media(max-width:650px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.panel{padding:16px}}
</style>
</head>

<body>
<header>
  <h2>World of BlessGlow — Admin</h2>
  <button id="logoutBtn" class="secondary hidden" onclick="logout()">Log Out</button>
</header>

<section id="login" class="panel">
  <h2>Admin Login</h2>
  <label>Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="Admin email">
  <label>Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Password">
  <button style="width:100%;margin-top:18px" onclick="login()">Log In</button>
  <p id="loginMessage" class="message"></p>
</section>

<main id="dashboard" class="hidden">
  <div class="tabs">
    <button class="active" onclick="showTab('books',this)">Books</button>
    <button onclick="showTab('chapters',this)">Chapters</button>
    <button onclick="showTab('reviews',this)">Reviews</button>
  </div>

  <!-- BOOKS -->
  <section id="booksTab">
    <div class="panel">
      <h3 id="bookFormTitle">Add a Book</h3>
      <input type="hidden" id="bookId">

      <div class="grid">
        <div><label>Book Title</label><input id="title" placeholder="Book title"></div>
        <div><label>Book Slug</label><input id="slug" placeholder="book-title"></div>
        <div>
          <label>Main Genre</label>
          <select id="mainGenre" onchange="updateSubgenres()"></select>
        </div>
        <div>
          <label>Subgenre</label>
          <select id="subgenre"></select>
        </div>
        <div>
          <label>Publication Status</label>
          <select id="bookStatus">
            <option value="draft">Draft — Private</option>
            <option value="coming_soon">Coming Soon</option>
            <option value="ongoing">Ongoing</option>
            <option value="completed">Completed</option>
            <option value="published">Published</option>
            <option value="archived">Archived — Private</option>
          </select>
        </div>
        <div><label>Release Date</label><input id="releaseDate" type="date"></div>
      </div>

      <label>Description</label>
      <textarea id="description" placeholder="Write the book description..."></textarea>

      <label>Book Cover</label>
      <input id="coverFile" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewCover()">
      <img id="coverPreview" alt="Cover preview">

      <div class="checks">
        <label><input id="featured" type="checkbox"> Featured on homepage</label>
        <label><input id="editorsPick" type="checkbox"> Editor's Pick</label>
        <label><input id="freeInterest" type="checkbox"> Allow Notify Me</label>
        <label><input id="preorder" type="checkbox"> Allow Preorder</label>
      </div>

      <div class="actions">
        <button onclick="saveBook()">Save Book</button>
        <button class="secondary" onclick="clearBookForm()">Clear Form</button>
      </div>
      <p id="bookMessage" class="message"></p>
    </div>

    <div class="panel">
      <h3>Manage Books</h3>
      <input id="bookSearch" placeholder="Search books..." oninput="renderBooks()">
      <div id="booksList">Loading books...</div>
    </div>
  </section>

  <!-- CHAPTERS -->
  <section id="chaptersTab" class="hidden">
    <div class="panel">
      <h3 id="chapterFormTitle">Add a Chapter</h3>
      <input type="hidden" id="chapterId">

      <label>Select Book</label>
      <select id="chapterBook" onchange="loadChapters()">
        <option value="">Choose a book</option>
      </select>

      <div class="grid">
        <div><label>Chapter Number</label><input id="chapterNumber" type="number" min="1" placeholder="1"></div>
        <div><label>Chapter Title</label><input id="chapterTitle" placeholder="Chapter title"></div>
      </div>

      <label>Chapter Content</label>
      <textarea id="chapterContent" style="min-height:300px" placeholder="Write your chapter here..."></textarea>

      <label>Chapter Status</label>
      <select id="chapterStatus">
        <option value="draft">Draft — Only visible in Admin</option>
        <option value="published">Published — Visible to Readers</option>
      </select>

      <div class="actions">
        <button onclick="saveChapter()">Save Chapter</button>
        <button class="secondary" onclick="clearChapterForm()">Clear Form</button>
      </div>
      <p id="chapterMessage" class="message"></p>
    </div>

    <div class="panel">
      <h3>Manage Chapters</h3>
      <p style="color:var(--muted);font-size:13px">Choose a book above to view and manage its chapters.</p>
      <div id="chaptersList">Select a book to load its chapters.</div>
    </div>
  </section>

  <!-- REVIEWS -->
  <section id="reviewsTab" class="hidden">
    <div class="panel">
      <h3>Reader Reviews</h3>
      <div class="grid">
        <div>
          <label>Filter by Book</label>
          <select id="reviewBookFilter" onchange="loadReviews()">
            <option value="">All Books</option>
          </select>
        </div>
        <div>
          <label>Review Status</label>
          <select id="reviewStatusFilter" onchange="loadReviews()">
            <option value="">All Reviews</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
      </div>
      <div id="reviewsList">Open this tab to load reviews.</div>
    </div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://zngagaolaiidgyxoldsh.supabase.co";
const SUPABASE_KEY = "sb_publishable_e0wd6fhM_Fr7gsKkKzT2RA_vAReV50F";
const ADMIN_ID = "2bd42c9f-de63-4c68-a685-2c541b1a549c";
const REVIEW_API = "https://world-of-blessglow.pages.dev/api/admin/reviews";

const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let books = [];
let chapters = [];
let reviews = [];

const genres = {
"Romance":["Campus Romance","Slow-Burn Romance","Enemies to Lovers","Friends to Lovers","Second-Chance Love","Forbidden Love","Unrequited Love","Billionaire Romance","Fake Dating","Love Triangle"],
"Revenge & Comebacks":["Betrayed Heiress","Revenge Against an Ex","Family Revenge","Revenge After Rejection","Secret Identity","The Ultimate Comeback","Revenge and Redemption","From Underdog to Powerful","The Heiress Returns","The Revenge Plan"],
"Dark Romance":["Obsession and Attraction","Forbidden Dark Love","Gothic Romance","Mafia Romance","Morally Grey Love Interests","Rivals with Chemistry","Dangerous Secrets","Twisted Relationships","Possessive Love","The Dangerous Deal"],
"Royal Stories":["Secret Princess","Hidden Heir","Royal Romance","Arranged Royal Marriage","Lost Princess","Palace Intrigue","Crown and Succession","Exiled Royal","Royal Bodyguard Romance","The Secret Royal Wedding"],
"Fantasy & Magic":["Dark Fantasy","Magical Academy","Witches and Wizards","Cursed Kingdoms","Mythical Creatures","Brutal Fantasy","Elemental Powers","Epic Fantasy Quests","Dragon Riders","Enchanted Realms"],
"Werewolf & Shifter":["Alpha and Luna","Rejected Mates","Fated Mates","Forbidden Mates","Royal Werewolves","Rogue Wolves","Hidden Shifter","Human and Werewolf","The Alpha's Secret","War of the Wolf Packs"],
"Mystery & Secrets":["Murder Mystery","The Missing Heiress","Hidden Identity","Family Secrets","Secret Societies","Locked-Room Mystery","Supernatural Mystery","Detective Investigations","The Secret Nobody Knows","The Inheritance Mystery"],
"Thriller & Suspense":["Psychological Thriller","Crime Thriller","Conspiracy","Survival Thriller","Cat and Mouse","Domestic Suspense","High-Stakes Pursuits","Political Thriller","The Stalker Next Door","The Dangerous Witness"],
"Drama & Scandals":["Family Drama","Betrayal and Lies","Friendship Conflicts","Love Triangles","Marriage Drama","Social-Class Conflict","Secrets and Scandals","Sibling Rivalry","Celebrity Scandals","The Secret Inheritance"],
"Young Adult & Coming-of-Age":["First Love","School Life","University Life","Academic Rivals","Friendship and Loyalty","Identity and Self-Discovery","Family Expectations","Young Adult Fantasy","Dark Academia","The New Girl"],
"Healing & Second Chances":["Healing After Heartbreak","Starting Over","Redemption","Forgiveness and Healing","Rebuilding Trust","Finding Yourself","Fresh Beginnings","Learning to Let Go","Life After Betrayal","Recovering from Loss"],
"Vampires & Immortals":["Vampire Romance","Ancient Vampires","Vampire Royalty","Immortal Love","Human and Vampire","Vampire Hunters","Cursed Immortals","Supernatural Clans","Vampire Academy","The Forbidden Bloodline"]
};

function el(id){return document.getElementById(id)}
function message(id,text){el(id).textContent=text}
function escapeHTML(value=""){
 return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function showTab(tab,button){
 ["books","chapters","reviews"].forEach(x=>el(x+"Tab").classList.toggle("hidden",x!==tab));
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 if(tab==="chapters") fillChapterBooks();
 if(tab==="reviews") loadReviews();
}
function updateSubgenres(selected=""){
 const genre=el("mainGenre").value;
 el("subgenre").innerHTML=(genres[genre]||[]).map(s=>`<option ${s===selected?"selected":""}>${escapeHTML(s)}</option>`).join("");
}
function setupGenres(){
 el("mainGenre").innerHTML=Object.keys(genres).map(g=>`<option>${escapeHTML(g)}</option>`).join("");
 updateSubgenres();
}
async function login(){
 message("loginMessage","Signing in...");
 const {error}=await db.auth.signInWithPassword({email:el("email").value,password:el("password").value});
 if(error){message("loginMessage",error.message);return}
 await checkSession();
}
async function logout(){
 await db.auth.signOut();
 location.reload();
}
async function checkSession(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){el("login").classList.remove("hidden");return}
 if(session.user.id!==ADMIN_ID){
  await db.auth.signOut();
  message("loginMessage","This account is not authorised as an administrator.");
  el("login").classList.remove("hidden");
  return;
 }
 el("login").classList.add("hidden");
 el("dashboard").classList.remove("hidden");
 el("logoutBtn").classList.remove("hidden");
 await loadBooks();
}
async function loadBooks(){
 const {data,error}=await db.from("books").select("*").order("created_at",{ascending:false});
 if(error){el("booksList").textContent=error.message;return}
 books=data||[];
 renderBooks();
 fillChapterBooks();
 fillReviewBooks();
}
function renderBooks(){
 const term=el("bookSearch").value.toLowerCase();
 const list=books.filter(b=>(b.title||"").toLowerCase().includes(term)||(b.slug||"").toLowerCase().includes(term));
 el("booksList").innerHTML=list.length?list.map(b=>`
 <div class="item">
  <strong>${escapeHTML(b.title)}</strong>
  <small>${escapeHTML(b.main_genre||"")} · ${escapeHTML(b.subgenre||"")} · <span class="status">${escapeHTML(b.publication_status||"")}</span></small>
  <div class="actions">
   <button onclick="editBook('${b.id}')">Edit</button>
   <button class="secondary" onclick="openChaptersFor('${b.id}')">Chapters</button>
  </div>
 </div>`).join(""):"No books found.";
}
function previewCover(){
 const file=el("coverFile").files[0];
 if(!file)return;
 el("coverPreview").src=URL.createObjectURL(file);
 el("coverPreview").style.display="block";
}
async function saveBook(){
 const id=el("bookId").value;
 const title=el("title").value.trim();
 const slug=el("slug").value.trim();
 if(!title||!slug){message("bookMessage","Enter a book title and slug.");return}
 message("bookMessage","Saving...");
 let cover_url=books.find(b=>b.id===id)?.cover_url||null;
 const file=el("coverFile").files[0];

 if(file){
  if(file.size>20*1024*1024){message("bookMessage","Cover image must be 20 MB or smaller.");return}
  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"-");
  const path=`${slug}/${Date.now()}-${safeName}`;
  const {error:uploadError}=await db.storage.from("book-covers").upload(path,file,{upsert:true,contentType:file.type});
  if(uploadError){message("bookMessage",uploadError.message);return}
  const {data}=db.storage.from("book-covers").getPublicUrl(path);
  cover_url=data.publicUrl;
 }

 const record={
  title,slug,description:el("description").value.trim(),
  main_genre:el("mainGenre").value,subgenre:el("subgenre").value,
  publication_status:el("bookStatus").value,
  release_date:el("releaseDate").value||null,
  cover_url,
  is_featured:el("featured").checked,
  is_editors_pick:el("editorsPick").checked,
  allow_free_interest:el("freeInterest").checked,
  allow_preorder:el("preorder").checked
 };
 const result=id?await db.from("books").update(record).eq("id",id):await db.from("books").insert(record);
 if(result.error){message("bookMessage",result.error.message);return}
 clearBookForm();
 message("bookMessage","Book saved successfully.");
 await loadBooks();
}
function editBook(id){
 const b=books.find(x=>x.id===id);if(!b)return;
 el("bookId").value=b.id;
 el("title").value=b.title||"";
 el("slug").value=b.slug||"";
 el("description").value=b.description||"";
 el("mainGenre").value=b.main_genre||Object.keys(genres)[0];
 updateSubgenres(b.subgenre||"");
 el("bookStatus").value=b.publication_status||"draft";
 el("releaseDate").value=b.release_date||"";
 el("featured").checked=!!b.is_featured;
 el("editorsPick").checked=!!b.is_editors_pick;
 el("freeInterest").checked=!!b.allow_free_interest;
 el("preorder").checked=!!b.allow_preorder;
 el("coverPreview").src=b.cover_url||"";
 el("coverPreview").style.display=b.cover_url?"block":"none";
 el("bookFormTitle").textContent="Edit Book";
 window.scrollTo({top:0,behavior:"smooth"});
}
function clearBookForm(){
 ["bookId","title","slug","description","releaseDate"].forEach(id=>el(id).value="");
 el("bookStatus").value="draft";
 ["featured","editorsPick","freeInterest","preorder"].forEach(id=>el(id).checked=false);
 el("coverFile").value="";
 el("coverPreview").style.display="none";
 el("bookFormTitle").textContent="Add a Book";
 updateSubgenres();
}

function fillChapterBooks(selected=""){
 el("chapterBook").innerHTML='<option value="">Choose a book</option>'+
 books.filter(b=>!["draft","archived"].includes(b.publication_status))
 .map(b=>`<option value="${b.id}" ${b.id===selected?"selected":""}>${escapeHTML(b.title)}</option>`).join("");
}
function openChaptersFor(id){
 showTab("chapters",document.querySelectorAll(".tabs button")[1]);
 fillChapterBooks(id);
 loadChapters();
}
async function loadChapters(){
 const bookId=el("chapterBook").value;
 if(!bookId){el("chaptersList").textContent="Select a book to load its chapters.";return}
 el("chaptersList").textContent="Loading chapters...";
 const {data,error}=await db.from("chapters").select("*").eq("book_id",bookId).order("chapter_number",{ascending:true});
 if(error){el("chaptersList").textContent=error.message;return}
 chapters=data||[];
 renderChapters();
}
function renderChapters(){
 el("chaptersList").innerHTML=chapters.length?chapters.map(c=>`
 <div class="item">
  <strong>Chapter ${escapeHTML(c.chapter_number)}: ${escapeHTML(c.title)}</strong>
  <small><span class="status">${escapeHTML(c.publication_status)}</span></small>
  <div class="actions">
   <button onclick="editChapter('${c.id}')">Edit</button>
   <button class="danger" onclick="deleteChapter('${c.id}')">Delete</button>
  </div>
 </div>`).join(""):"No chapters have been added to this book yet.";
}
async function saveChapter(){
 const id=el("chapterId").value;
 const book_id=el("chapterBook").value;
 const chapter_number=Number(el("chapterNumber").value);
 const title=el("chapterTitle").value.trim();
 const content=el("chapterContent").value.trim();
 const publication_status=el("chapterStatus").value;

 if(!book_id||!chapter_number||chapter_number<1||!title||!content){
  message("chapterMessage","Choose a book and enter the chapter number, title and content.");return;
 }
 const duplicate=chapters.find(c=>Number(c.chapter_number)===chapter_number&&c.id!==id);
 if(duplicate){message("chapterMessage","That chapter number already exists for this book.");return}

 message("chapterMessage","Saving chapter...");
 const existing=chapters.find(c=>c.id===id);
 const record={
  book_id,chapter_number,title,content,publication_status,
  published_at:publication_status==="published"?(existing?.published_at||new Date().toISOString()):null,
  updated_at:new Date().toISOString()
 };
 const result=id
  ?await db.from("chapters").update(record).eq("id",id)
  :await db.from("chapters").insert(record);
 if(result.error){message("chapterMessage",result.error.message);return}
 clearChapterForm();
 message("chapterMessage","Chapter saved successfully.");
 await loadChapters();
}
function editChapter(id){
 const c=chapters.find(x=>x.id===id);if(!c)return;
 el("chapterId").value=c.id;
 el("chapterNumber").value=c.chapter_number;
 el("chapterTitle").value=c.title||"";
 el("chapterContent").value=c.content||"";
 el("chapterStatus").value=c.publication_status||"draft";
 el("chapterFormTitle").textContent="Edit Chapter";
 window.scrollTo({top:0,behavior:"smooth"});
}
async function deleteChapter(id){
 if(!confirm("Delete this chapter permanently?"))return;
 const {error}=await db.from("chapters").delete().eq("id",id);
 if(error){message("chapterMessage",error.message);return}
 message("chapterMessage","Chapter deleted.");
 await loadChapters();
}
function clearChapterForm(){
 el("chapterId").value="";
 el("chapterNumber").value="";
 el("chapterTitle").value="";
 el("chapterContent").value="";
 el("chapterStatus").value="draft";
 el("chapterFormTitle").textContent="Add a Chapter";
}

function fillReviewBooks(){
 el("reviewBookFilter").innerHTML='<option value="">All Books</option>'+
 books.map(b=>`<option value="${escapeHTML(b.slug)}">${escapeHTML(b.title)}</option>`).join("");
}
async function loadReviews(){
 const {data:{session}}=await db.auth.getSession();
 if(!session)return;
 el("reviewsList").textContent="Loading reviews...";
 const params=new URLSearchParams();
 if(el("reviewBookFilter").value)params.set("book_slug",el("reviewBookFilter").value);
 if(el("reviewStatusFilter").value)params.set("status",el("reviewStatusFilter").value);

 try{
  const response=await fetch(`${REVIEW_API}?${params.toString()}`,{
   headers:{Authorization:`Bearer ${session.access_token}`}
  });
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||"Could not load reviews.");
  reviews=Array.isArray(result)?result:(result.reviews||[]);
  renderReviews();
 }catch(error){el("reviewsList").textContent=error.message}
   }
  function renderReviews(){
 if(!reviews.length){el("reviewsList").textContent="No reviews found.";return}
 el("reviewsList").innerHTML=reviews.map(r=>{
  const answers=r.discussion_answers||{};
  const answerHTML=Object.entries(answers).map(([key,value])=>{
   const match=String(key).match(/(\d+)/);
   const number=match?Number(match[1]):null;
   const displayNumber=number!==null&&number>=1&&number<=6?number+1:null;
   return `<div class="review-answer">${displayNumber?`<b>${displayNumber}. </b>`:""}${escapeHTML(value)}</div>`;
  }).join("");
  return `<div class="item">
   <strong>${escapeHTML(r.display_name||"Reader")}</strong>
   <small>${escapeHTML(r.book_slug||"")} · ${escapeHTML(r.status||"pending")} · ${"★".repeat(Number(r.rating)||0)}</small>
   <p>${escapeHTML(r.review_text||"")}</p>
   ${answerHTML}
   <div class="actions">
    <button onclick="moderateReview('${r.id}','approved')">Approve</button>
    <button class="secondary" onclick="moderateReview('${r.id}','rejected')">Reject</button>
    <button class="danger" onclick="deleteReview('${r.id}')">Delete</button>
   </div>
  </div>`;
 }).join("");
}
async function reviewRequest(id,method,body){
 const {data:{session}}=await db.auth.getSession();
 const response=await fetch(REVIEW_API,{
  method,
  headers:{
   "Content-Type":"application/json",
   Authorization:`Bearer ${session.access_token}`
  },
  body:body?JSON.stringify(body):undefined
 });
 const result=await response.json();
 if(!response.ok)throw new Error(result.error||"Review action failed.");
  return result;
}
async function moderateReview(id,status){
 try{
  await reviewRequest(id,"PATCH",{id,status});
  await loadReviews();
 }catch(error){alert(error.message)}
}
async function deleteReview(id){
 if(!confirm("Delete this review?"))return;
 try{
  await reviewRequest(id,"DELETE",{id});
  await loadReviews();
 }catch(error){alert(error.message)}
}

setupGenres();
db.auth.onAuthStateChange(()=>checkSession());
checkSession();
</script>
</body>
</html>
